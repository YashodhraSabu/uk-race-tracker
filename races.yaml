# UK Race & Ballot Tracker data. One record per race edition (slug + year).
#
# Datetimes are UK local time with no offset, e.g. 2026-04-27T10:00.
# confidence: confirmed (read on the official page; needs source_url and
#             last_verified) / expected (rough date from organisers) /
#             estimated (based on last year's edition).
# Only confirmed records go into the calendar feeds.
#
# Field reference: README.md "Data model"; JSON Schema: schema/races.schema.json.
#
# The records below are the starter candidates from the project plan. None has
# been checked against its official page yet, so every date is blank.

races:
