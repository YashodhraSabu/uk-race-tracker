name: Check race pages

on:
  schedule:
    - cron: "0 6 * * *" # daily, 07:00 UK summer time / 06:00 winter
  workflow_dispatch:
    inputs:
      alert_after_days:
        description: "Open a 'page unreachable' issue after this many days of failures (use 0 to test)"
        default: "7"
      propose_for:
        description: "Race id to run the LLM proposal for now, e.g. cardiff-half-2027 (optional)"
        default: ""

permissions:
  contents: write # create the bot branch and commit the proposed races.yaml edit
  pull-requests: write # open the pull request
  issues: write # page-change and page-unreachable issues

concurrency:
  group: check-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Page snapshots live in the Actions cache, not the public repo, so we
      # don't republish race sites' text. If the cache is ever lost, the next
      # run just takes fresh snapshots.
      - name: Restore page snapshots
        uses: actions/cache/restore@v6
        with:
          path: state
          key: page-state-${{ github.run_id }}
          restore-keys: page-state-

      - run: python check_pages.py --issues ${PROPOSE_FOR:+--propose-for "$PROPOSE_FOR"}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # LLM proposals; plain issues without it
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }} # optional override
          ALERT_AFTER_DAYS: ${{ inputs.alert_after_days }} # empty on scheduled runs: default 7
          PROPOSE_FOR: ${{ inputs.propose_for }}

      - name: Save page snapshots
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: page-state-${{ github.run_id }}
