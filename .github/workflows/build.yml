name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also started by "Check race pages" after each daily check

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Check the JSON Schema is up to date
        run: |
          python build.py --write-schema
          git diff --exit-code schema/ || (echo "Run: python build.py --write-schema" && exit 1)
      - name: Restore the daily page check's state
        # build.py only reads state/pages.json (when each page last loaded and
        # last changed) for the "page unchanged, checked ..." notes; no page
        # text goes into the site. Missing is fine.
        uses: actions/cache/restore@v6
        with:
          path: state
          key: page-state-none # never matches exactly; the prefix below picks the newest
          restore-keys: page-state-
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: python build.py
        env:
          # GitHub Pages address of whichever account or org owns the repo
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Repo variable; the "Suggest a race" link is hidden when it's unset
          SUGGEST_URL: ${{ vars.SUGGEST_URL }}
          # Repo variable; visit counting is off when it's unset and on pull requests
          GOATCOUNTER_URL: ${{ github.event_name != 'pull_request' && vars.GOATCOUNTER_URL || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
